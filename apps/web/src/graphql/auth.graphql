# Descrição: Operações GraphQL de autenticação usadas pelo Auth.js (no servidor Next).

mutation Login($input: LoginInput!) {
  login(input: $input) {
    accessToken
    user {
      id
      email
      name
      image
      role
    }
  }
}

mutation AuthenticateWithProvider($input: ProviderAuthInput!) {
  authenticateWithProvider(input: $input) {
    accessToken
    user {
      id
      email
      name
      image
      role
    }
  }
}
